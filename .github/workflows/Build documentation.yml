name: Build documentation - CI Check
on:
  push:
    branches:
      - main
    paths:
        - "docs/**"
        - ".github/workflows/Build documentation.yml"
        - ".github/workflows/Deploy docs.yml"
        - "pyproject.toml"
        - "zensical.toml"
  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/Build documentation.yml"
      - ".github/workflows/Deploy docs.yml"
      - "pyproject.toml"
      - "zensical.toml"
  workflow_call:
    inputs:
      upload_pages_artifact:
        description: Upload the built site for GitHub Pages deployment
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    name: Build documentation website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install dependencies with uv
        run: uv sync --locked
      - name: Build Zensical documentation
        run: uv run --locked zensical build --clean --strict
      - uses: actions/upload-pages-artifact@v3
        if: ${{ inputs.upload_pages_artifact }}
        with:
          path: site